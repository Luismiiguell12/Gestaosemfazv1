name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao-semfaz
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestao-semfaz/package-lock.json
      - run: npm ci
      - name: Dependências (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Testes unitários e de banco (RLS, aprovações, auditoria)
        run: npm test
      - name: Teste de backup e restauração (dados fictícios)
        run: |
          set -o pipefail
          bash scripts/testar-restauracao.sh 2>&1 | grep -v '^pg_dump: \(warning\|detail\|hint\)'
      - name: Verificação de segurança do banco
        run: |
          psql -d gestao_semfaz_test -v ON_ERROR_STOP=1 -At -F ' | ' -f scripts/verificar-seguranca.sql | tee /tmp/verif.txt
          ! grep -q ' | FALHA | ' /tmp/verif.txt
      - name: Build estático + CSP
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-publica-ficticia
      - name: E2E (fumaça, API simulada)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: telas
          path: gestao-semfaz/test-results/telas
          retention-days: 7
