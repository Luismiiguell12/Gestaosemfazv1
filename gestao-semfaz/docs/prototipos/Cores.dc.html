<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Opções de cor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1B2433}
</style>
</helmet>
<div style="width:1440px;height:560px;box-sizing:border-box;padding:40px 48px;background:#F4F6F9;display:flex;flex-direction:column;gap:24px">
  <div>
    <h1 style="margin:0;font-size:26px;color:#0F2A4A">Opções de cor · todas em azul</h1>
    <p style="margin:6px 0 0;font-size:14px;color:#5B6678">Verde, laranja e vermelho continuam reservados para situação positiva, alerta e crítica. Em cada tela, o botão Tweaks troca o tema.</p>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px">
    <sc-for list="{{themes}}" as="th" hint-placeholder-count="4">
      <div style="background:#fff;border:1px solid #E1E6EE;border-radius:14px;overflow:hidden;display:flex;flex-direction:column">
        <div style="display:flex;height:210px">
          <div style="width:46%;background:{{th.nav}};padding:16px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px">
            <svg role="img" aria-label="Logo no tema {{th.name}}" width="34" height="34" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="{{th.logo}}"></rect><path d="M28 13.5A10 10 0 1 0 30 21h-9" fill="none" stroke="{{th.nav}}" stroke-width="3.6" stroke-linecap="round"></path><rect x="17" y="24" width="3" height="5" rx="1" fill="{{th.nav}}"></rect><rect x="21.5" y="21" width="3" height="8" rx="1" fill="{{th.nav}}"></rect></svg>
            <div style="height:26px;border-radius:6px;background:{{th.primary}};color:#fff;font-size:11px;display:flex;align-items:center;padding-left:8px">Painel</div>
            <div style="font-size:11px;color:#DCE4F0;padding-left:8px">Demandas</div>
            <div style="font-size:11px;color:#DCE4F0;padding-left:8px">Calendário</div>
          </div>
          <div style="flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:10px;background:#F4F6F9">
            <div style="font-size:15px;font-weight:700;color:{{th.ink}}">Título</div>
            <div style="height:36px;border-radius:8px;background:{{th.primary}};color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">Botão principal</div>
            <div style="font-size:12px;color:{{th.primary}};text-decoration:underline">Link de ação</div>
          </div>
        </div>
        <div style="padding:14px 16px;display:flex;flex-direction:column;gap:4px">
          <div style="font-size:16px;font-weight:700;color:#0F2A4A">{{th.name}}</div>
          <div style="font-size:13px;color:#3A4557">{{th.desc}}</div>
          <div style="font-size:12px;color:#5B6678;margin-top:4px">{{th.codes}}</div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const themes = [
      { name: 'Marinho', desc: 'Clássico e institucional, com detalhe dourado no logo.', nav: '#0F2A4A', ink: '#0F2A4A', primary: '#1D5FD1', logo: '#F2B544' },
      { name: 'Azul petróleo', desc: 'Mais sóbrio, puxa para o verde-azulado. Menos comum em sistemas públicos.', nav: '#0B3442', ink: '#0B3442', primary: '#0E7490', logo: '#F2B544' },
      { name: 'Índigo (escolhido)', desc: 'Azul mais vivo e moderno, com logo em azul-claro. Tema padrão do sistema.', nav: '#18215A', ink: '#1A2660', primary: '#3A57E8', logo: '#8FD3FF' },
      { name: 'Ardósia', desc: 'Menu grafite neutro, com o azul só nas ações. O mais discreto.', nav: '#1E293B', ink: '#1E3A5F', primary: '#2563EB', logo: '#93C5FD' }
    ].map((t) => ({ ...t, codes: 'Menu ' + t.nav + ' · Ação ' + t.primary }));
    return { themes };
  }
}
</script>
</body>
</html>
